<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}TechGear{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="{% url 'index' %}" class="logo">TechGear</a>
      <nav>
        <a href="{% url 'index' %}">Catálogo</a>
        <a href="{% url 'crear_producto' %}">Añadir producto</a>
        <a href="{% url 'carrito' %}" class="cart-link">
          Carrito
          {% if carrito_count %}<span class="badge">{{ carrito_count }}</span>{% endif %}
        </a>
      </nav>
    </div>
  </header>

  <main>
    {% if messages %}
      {% for m in messages %}
        <div class="alert ok">{{ m }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
